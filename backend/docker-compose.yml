services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ctu_postgres_db
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=ctu_bus_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ctu_bus}
    ports:
      # Chỉ cho phép truy cập từ localhost và đổi port host sang 5433
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: ctu_fastapi_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      # Đổi port host sang 8001 để tránh trùng với ai-shopping-backend (8000)
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: